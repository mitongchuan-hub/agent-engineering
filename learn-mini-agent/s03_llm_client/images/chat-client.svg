<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" font-family="system-ui, 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
    <marker id="arrow-b" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <linearGradient id="hd" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e3a5f"/><stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>
  <rect width="720" height="520" fill="#fafbfc" rx="8"/>
  <rect x="0" y="0" width="720" height="48" fill="url(#hd)" rx="8"/>
  <rect x="0" y="40" width="720" height="8" fill="url(#hd)"/>
  <text x="360" y="31" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">ChatClient — 模型无关的统一接口</text>

  <!-- 顶部：Agent 业务代码 -->
  <rect x="240" y="76" width="240" height="56" rx="10" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
  <text x="360" y="100" fill="#166534" font-size="13" font-weight="700" text-anchor="middle">Agent 业务代码</text>
  <text x="360" y="120" fill="#64748b" font-size="10" text-anchor="middle">只认 ChatClient，不认厂商</text>

  <line x1="360" y1="132" x2="360" y2="168" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 中间：ChatClient -->
  <rect x="180" y="170" width="360" height="110" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="360" y="198" fill="#1e3a5f" font-size="15" font-weight="700" text-anchor="middle">ChatClient</text>
  <line x1="205" y1="208" x2="515" y2="208" stroke="#e2e8f0"/>
  <text x="360" y="230" fill="#334155" font-size="11" text-anchor="middle">chat(messages, tools) → 标准 assistant 消息</text>
  <text x="360" y="250" fill="#64748b" font-size="10" text-anchor="middle">统一返回 {content, tool_calls} | 错误抛 LLMError | base_url 自动补 /v1</text>
  <text x="360" y="270" fill="#94a3b8" font-size="9" text-anchor="middle">协议差异在这一层被抹平</text>

  <!-- 向下：三个分支 -->
  <line x1="300" y1="280" x2="120" y2="330" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="40" y="336" width="160" height="80" rx="10" fill="#f0f4ff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="120" y="360" fill="#1e3a5f" font-size="12" font-weight="600" text-anchor="middle">OpenAI 系</text>
  <text x="120" y="382" fill="#64748b" font-size="10" text-anchor="middle">base_url=…/v1</text>
  <text x="120" y="398" fill="#94a3b8" font-size="9" text-anchor="middle">gpt-4o / gpt-5</text>

  <line x1="360" y1="280" x2="360" y2="330" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="280" y="336" width="160" height="80" rx="10" fill="#f0f4ff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="360" y="360" fill="#1e3a5f" font-size="12" font-weight="600" text-anchor="middle">DeepSeek 等</text>
  <text x="360" y="382" fill="#64748b" font-size="10" text-anchor="middle">兼容协议</text>
  <text x="360" y="398" fill="#94a3b8" font-size="9" text-anchor="middle">deepseek-chat</text>

  <line x1="420" y1="280" x2="590" y2="330" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-b)" stroke-dasharray="6,3"/>
  <rect x="520" y="336" width="160" height="80" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="600" y="360" fill="#92400e" font-size="12" font-weight="600" text-anchor="middle">本地假服务器</text>
  <text x="600" y="382" fill="#64748b" font-size="10" text-anchor="middle">无 Key 也能验证协议</text>
  <text x="600" y="398" fill="#94a3b8" font-size="9" text-anchor="middle">本步演示用</text>

  <!-- 底部 -->
  <text x="360" y="462" fill="#94a3b8" font-size="11" text-anchor="middle">换模型 = 改 .env 里的 base_url + model 两个字符串（配置外置）</text>
  <text x="360" y="484" fill="#cbd5e1" font-size="10" text-anchor="middle">配套代码：learn-mini-agent/s03_llm_client/code.py</text>
</svg>