<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" font-family="system-ui, 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
    <marker id="arrow-b" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <linearGradient id="hd" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e3a5f"/><stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>
  <rect width="720" height="560" fill="#fafbfc" rx="8"/>
  <rect x="0" y="0" width="720" height="48" fill="url(#hd)" rx="8"/>
  <rect x="0" y="40" width="720" height="8" fill="url(#hd)"/>
  <text x="360" y="31" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">Tool Registry — 函数签名就是 Schema</text>

  <!-- 左：开发者的函数 -->
  <rect x="40" y="80" width="210" height="130" rx="10" fill="#fff" stroke="#2563eb" stroke-width="2"/>
  <text x="145" y="104" fill="#1e3a5f" font-size="13" font-weight="700" text-anchor="middle">开发者只写普通函数</text>
  <line x1="60" y1="114" x2="230" y2="114" stroke="#e2e8f0"/>
  <text x="145" y="136" fill="#334155" font-size="11" text-anchor="middle">@registry.tool()</text>
  <text x="145" y="154" fill="#334155" font-size="11" text-anchor="middle">def add(a: int, b: int)</text>
  <text x="145" y="172" fill="#64748b" font-size="10" text-anchor="middle">…类型注解 + 可选描述</text>
  <text x="145" y="194" fill="#94a3b8" font-size="9" text-anchor="middle">单一事实来源</text>

  <!-- 中间：生成引擎 -->
  <rect x="300" y="95" width="150" height="100" rx="10" fill="#f0f4ff" stroke="#2563eb" stroke-width="2"/>
  <text x="375" y="122" fill="#1e3a5f" font-size="13" font-weight="700" text-anchor="middle">schema 生成</text>
  <line x1="320" y1="131" x2="430" y2="131" stroke="#e2e8f0"/>
  <text x="375" y="152" fill="#334155" font-size="11" text-anchor="middle">inspect.signature</text>
  <text x="375" y="168" fill="#334155" font-size="11" text-anchor="middle">typing.get_type_hints</text>
  <text x="375" y="186" fill="#64748b" font-size="10" text-anchor="middle">签名 → JSON Schema</text>

  <line x1="250" y1="145" x2="298" y2="145" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 右：两个出口 -->
  <rect x="495" y="80" width="185" height="100" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="587" y="106" fill="#334155" font-size="12" font-weight="600" text-anchor="middle">×1 给模型看（说明书）</text>
  <text x="587" y="128" fill="#64748b" font-size="10" text-anchor="middle">registry.schemas()</text>
  <text x="587" y="146" fill="#94a3b8" font-size="9" text-anchor="middle">→ LLM 用它选工具/传参</text>
  <text x="587" y="168" fill="#64748b" font-size="10" text-anchor="middle">→ 单一事实来源</text>

  <rect x="495" y="200" width="185" height="100" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="587" y="226" fill="#334155" font-size="12" font-weight="600" text-anchor="middle">×2 给我执行（守门员）</text>
  <text x="587" y="248" fill="#64748b" font-size="10" text-anchor="middle">registry.call(name, args)</text>
  <text x="587" y="266" fill="#94a3b8" font-size="9" text-anchor="middle">→ 异常回传字符串给模型</text>

  <line x1="450" y1="130" x2="493" y2="130" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-b)"/>
  <line x1="450" y1="160" x2="493" y2="248" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-b)"/>

  <!-- 底部：LLM 循环 -->
  <rect x="120" y="330" width="480" height="96" rx="10" fill="#fffbe6" stroke="#d97706" stroke-width="2"/>
  <text x="360" y="356" fill="#92400e" font-size="13" font-weight="700" text-anchor="middle">运行时：ToolRegistry 贯穿循环</text>
  <text x="360" y="380" fill="#475569" font-size="11" text-anchor="middle">LLM 读 schemas() → 说"我要调 add(a=2,b=3)"</text>
  <text x="360" y="398" fill="#475569" font-size="11" text-anchor="middle">→ call() 解析/校验/执行 → 结果字符串回填</text>
  <text x="360" y="416" fill="#94a3b8" font-size="10" text-anchor="middle">函数签名 ≡ schema ≡ 执行入口：三合一</text>

  <text x="360" y="476" fill="#94a3b8" font-size="11" text-anchor="middle">收益：加一个工具 = 写一个函数 + 一行装饰器；代码与说明书永不漂移</text>
  <text x="360" y="498" fill="#cbd5e1" font-size="10" text-anchor="middle">配套代码：learn-mini-agent/s02_tool_registry/code.py</text>
</svg>