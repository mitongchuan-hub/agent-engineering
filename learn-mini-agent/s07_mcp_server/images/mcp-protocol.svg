<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" font-family="system-ui, 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
    <linearGradient id="hd" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e3a5f"/><stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>
  <rect width="720" height="560" fill="#fafbfc" rx="8"/>
  <rect x="0" y="0" width="720" height="48" fill="url(#hd)" rx="8"/>
  <rect x="0" y="40" width="720" height="8" fill="url(#hd)"/>
  <text x="360" y="31" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">MCP — JSON-RPC 2.0 + stdio，没有魔法</text>

  <!-- Client 列 -->
  <rect x="40" y="80" width="200" height="400" rx="10" fill="#f0f4ff" stroke="#2563eb" stroke-width="2"/>
  <text x="140" y="104" fill="#1e3a5f" font-size="13" font-weight="700" text-anchor="middle">MCP Client</text>
  <text x="140" y="122" fill="#64748b" font-size="10" text-anchor="middle">Agent 端 / 调用方</text>

  <rect x="55" y="140" width="170" height="36" rx="6" fill="#fff"/>
  <text x="140" y="156" fill="#334155" font-size="11" text-anchor="middle">① initialize（握手）</text>
  <text x="140" y="170" fill="#94a3b8" font-size="9" text-anchor="middle">声明版本与能力</text>
  <rect x="55" y="184" width="170" height="36" rx="6" fill="#fff"/>
  <text x="140" y="200" fill="#334155" font-size="11" text-anchor="middle">② notifications/initialized</text>
  <text x="140" y="214" fill="#94a3b8" font-size="9" text-anchor="middle">通知（无响应）</text>
  <rect x="55" y="228" width="170" height="36" rx="6" fill="#fff"/>
  <text x="140" y="244" fill="#334155" font-size="11" text-anchor="middle">③ tools/list</text>
  <text x="140" y="258" fill="#94a3b8" font-size="9" text-anchor="middle">问"你有什么工具"</text>
  <rect x="55" y="272" width="170" height="36" rx="6" fill="#fff"/>
  <text x="140" y="288" fill="#334155" font-size="11" text-anchor="middle">④ tools/call</text>
  <text x="140" y="302" fill="#94a3b8" font-size="9" text-anchor="middle">调用具体工具</text>

  <!-- 中间竖线区域 -->
  <rect x="248" y="90" width="224" height="380" rx="10" fill="#fff" stroke="#d97706" stroke-width="2"/>
  <text x="360" y="112" fill="#92400e" font-size="12" font-weight="700" text-anchor="middle">协议载体：JSON-RPC 2.0</text>
  <line x1="268" y1="120" x2="452" y2="120" stroke="#e2e8f0"/>
  <text x="360" y="146" fill="#334155" font-size="11" text-anchor="middle">每行一个 JSON 对象</text>
  <text x="360" y="166" fill="#64748b" font-size="10" text-anchor="middle">stdio：stdin 读请求</text>
  <text x="360" y="182" fill="#64748b" font-size="10" text-anchor="middle">stdout 写响应</text>
  <line x1="268" y1="200" x2="452" y2="200" stroke="#e2e8f0"/>
  <text x="360" y="224" fill="#475569" font-size="11" text-anchor="middle">请求: {"id":1,"method":…}</text>
  <text x="360" y="244" fill="#475569" font-size="11" text-anchor="middle">响应: {"id":1,"result":…}</text>
  <line x1="268" y1="262" x2="452" y2="262" stroke="#e2e8f0"/>
  <text x="360" y="286" fill="#92400e" font-size="11" font-weight="700" text-anchor="middle">错误分层</text>
  <text x="360" y="306" fill="#475569" font-size="10" text-anchor="middle">业务失败 → result.isError</text>
  <text x="360" y="324" fill="#475569" font-size="10" text-anchor="middle">协议失败 → error 字段</text>
  <line x1="268" y1="342" x2="452" y2="342" stroke="#e2e8f0"/>
  <text x="360" y="368" fill="#475569" font-size="10" text-anchor="middle">工具返回统一包</text>
  <text x="360" y="386" fill="#334155" font-size="11" text-anchor="middle">content:[{type:文本,…}]</text>
  <text x="360" y="420" fill="#94a3b8" font-size="9" text-anchor="middle">无官方 SDK，纯标准库实现</text>

  <!-- Server 列 -->
  <rect x="480" y="80" width="200" height="400" rx="10" fill="#fff8f0" stroke="#d97706" stroke-width="2"/>
  <text x="580" y="104" fill="#92400e" font-size="13" font-weight="700" text-anchor="middle">MCP Server</text>
  <text x="580" y="122" fill="#64748b" font-size="10" text-anchor="middle">工具提供方</text>
  <rect x="495" y="140" width="170" height="36" rx="6" fill="#fffbeb"/>
  <text x="580" y="156" fill="#92400e" font-size="11" text-anchor="middle">握手应答</text>
  <text x="580" y="170" fill="#94a3b8" font-size="9" text-anchor="middle">protocolVersion/capabilities</text>
  <rect x="495" y="228" width="170" height="36" rx="6" fill="#fffbeb"/>
  <text x="580" y="244" fill="#92400e" font-size="11" text-anchor="middle">返回工具清单</text>
  <text x="580" y="258" fill="#94a3b8" font-size="9" text-anchor="middle">name/description/inputSchema</text>
  <rect x="495" y="272" width="170" height="36" rx="6" fill="#fffbeb"/>
  <text x="580" y="288" fill="#92400e" font-size="11" text-anchor="middle">执行工具</text>
  <text x="580" y="302" fill="#94a3b8" font-size="9" text-anchor="middle">compute_match/read_file…</text>

  <!-- 箭头连接 -->
  <line x1="240" y1="158" x2="250" y2="158" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="472" y1="160" x2="494" y2="160" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="240" y1="250" x2="250" y2="250" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="472" y1="250" x2="494" y2="250" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="240" y1="292" x2="250" y2="292" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="472" y1="292" x2="494" y2="292" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 底部 -->
  <text x="360" y="520" fill="#94a3b8" font-size="11" text-anchor="middle">MCP 没有魔法：JSON-RPC 请求/响应 + stdio 行传输，仅此而已</text>
  <text x="360" y="542" fill="#cbd5e1" font-size="10" text-anchor="middle">配套代码：learn-mini-agent/s07_mcp_server/code.py</text>
</svg>