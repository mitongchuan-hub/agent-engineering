<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 600" font-family="system-ui, 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="720" height="600" fill="#fafbfc" rx="8"/>

  <!-- 标题 -->
  <rect x="0" y="0" width="720" height="48" fill="url(#header)" rx="8"/>
  <rect x="0" y="40" width="720" height="8" fill="url(#header)"/>
  <text x="360" y="31" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">Agent Loop — 一个 while 循环驱动整个 Agent</text>

  <!-- ===== 用户提问 ===== -->
  <rect x="50" y="78" width="170" height="54" rx="8" fill="#f0f4ff" stroke="#2563eb" stroke-width="2"/>
  <text x="135" y="101" fill="#1e3a5f" font-size="13" font-weight="600" text-anchor="middle">用户提问</text>
  <text x="135" y="120" fill="#64748b" font-size="11" text-anchor="middle">"帮我创建 hello.py"</text>

  <!-- 箭头：用户 → 消息列表 -->
  <line x1="135" y1="132" x2="135" y2="164" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <!-- ===== messages 列表 ===== -->
  <rect x="50" y="166" width="170" height="52" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="135" y="188" fill="#334155" font-size="12" font-weight="500" text-anchor="middle">messages[]</text>
  <text x="135" y="205" fill="#94a3b8" font-size="10" text-anchor="middle">累积式消息列表</text>

  <!-- 箭头：消息列表 → LLM -->
  <line x1="220" y1="192" x2="286" y2="192" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ===== LLM ===== -->
  <rect x="288" y="142" width="190" height="100" rx="8" fill="#fff" stroke="#2563eb" stroke-width="2"/>
  <text x="383" y="168" fill="#1e3a5f" font-size="14" font-weight="700" text-anchor="middle">大模型 (LLM)</text>
  <line x1="308" y1="178" x2="458" y2="178" stroke="#e2e8f0" stroke-width="1"/>
  <text x="383" y="197" fill="#475569" font-size="11" text-anchor="middle">模型阅读消息历史</text>
  <text x="383" y="213" fill="#475569" font-size="11" text-anchor="middle">判断：需要工具吗？</text>
  <text x="383" y="230" fill="#64748b" font-size="10" text-anchor="middle">返回 tool_calls / 回答</text>

  <!-- 箭头：LLM → 判断 -->
  <line x1="383" y1="242" x2="383" y2="282" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ===== 判断菱形 ===== -->
  <polygon points="383,288 475,326 383,364 291,326" fill="#fff8f0" stroke="#d97706" stroke-width="2"/>
  <text x="383" y="322" fill="#92400e" font-size="12" font-weight="600" text-anchor="middle">tool_calls</text>
  <text x="383" y="337" fill="#92400e" font-size="10" text-anchor="middle">不为空?</text>

  <!-- 箭头：否 → 结束 -->
  <line x1="475" y1="326" x2="560" y2="326" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="516" y="317" fill="#16a34a" font-size="10" font-weight="600" text-anchor="middle">否</text>

  <!-- ===== 结束 ===== -->
  <rect x="562" y="292" width="130" height="68" rx="10" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
  <text x="627" y="320" fill="#166534" font-size="13" font-weight="700" text-anchor="middle">最终回答</text>
  <text x="627" y="340" fill="#64748b" font-size="10" text-anchor="middle">循环结束</text>

  <!-- 箭头：是 → 工具执行 -->
  <line x1="383" y1="364" x2="383" y2="410" stroke="#d97706" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="398" y="392" fill="#d97706" font-size="10" font-weight="600" text-anchor="start">是</text>

  <!-- ===== 工具执行 ===== -->
  <rect x="283" y="412" width="200" height="64" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="383" y="436" fill="#92400e" font-size="13" font-weight="700" text-anchor="middle">执行工具</text>
  <text x="383" y="455" fill="#64748b" font-size="10" text-anchor="middle">call_tool(name, args)</text>
  <text x="383" y="468" fill="#64748b" font-size="10" text-anchor="middle">例如 execute_bash("ls")</text>

  <!-- 箭头：工具结果回填（回到 messages） -->
  <path d="M 383 476 L 383 522 L 135 522 L 135 220" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrow-blue)"/>
  <text x="268" y="514" fill="#2563eb" font-size="11" font-weight="600" text-anchor="middle">tool 结果回填 messages</text>

  <!-- 底部说明 -->
  <text x="360" y="556" fill="#94a3b8" font-size="11" text-anchor="middle">循环条件：有 tool_calls 就继续，没有就结束 —— 这就是 Agent 的心脏</text>
  <text x="360" y="578" fill="#cbd5e1" font-size="10" text-anchor="middle">配套代码：learn-mini-agent/s01_agent_loop/code.py</text>
</svg>