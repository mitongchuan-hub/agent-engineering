<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" font-family="system-ui, 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
    <marker id="arrow-b" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <linearGradient id="hd" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e3a5f"/><stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>
  <rect width="720" height="500" fill="#fafbfc" rx="8"/>
  <rect x="0" y="0" width="720" height="48" fill="url(#hd)" rx="8"/>
  <rect x="0" y="40" width="720" height="8" fill="url(#hd)"/>
  <text x="360" y="31" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">MCP Bridge — 工具成为可插拔服务</text>

  <!-- Agent -->
  <rect x="40" y="90" width="230" height="150" rx="10" fill="#fff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="155" y="114" fill="#1e3a5f" font-size="13" font-weight="700" text-anchor="middle">Agent（主循环）</text>
  <line x1="60" y1="124" x2="250" y2="124" stroke="#e2e8f0"/>
  <text x="155" y="146" fill="#334155" font-size="11" text-anchor="middle">内置工具：list/read/write…</text>
  <rect x="55" y="158" width="200" height="52" rx="8" fill="#f0f4ff" stroke="#2563eb" stroke-width="2"/>
  <text x="155" y="180" fill="#1e3a5f" font-size="12" font-weight="700" text-anchor="middle">mcp_call_tool(工具,参数)</text>
  <text x="155" y="200" fill="#64748b" font-size="9" text-anchor="middle">一个"万能工具"打通外部世界</text>

  <!-- 桥 -->
  <line x1="270" y1="165" x2="340" y2="165" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="342" y="140" width="120" height="50" rx="8" fill="#fff8f0" stroke="#d97706" stroke-width="2"/>
  <text x="402" y="162" fill="#92400e" font-size="11" font-weight="700" text-anchor="middle">MCP Client</text>
  <text x="402" y="180" fill="#64748b" font-size="9" text-anchor="middle">stdio 子进程</text>
  <line x1="462" y1="165" x2="500" y2="165" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Server + 工具 -->
  <rect x="502" y="90" width="180" height="150" rx="10" fill="#fff8f0" stroke="#d97706" stroke-width="2"/>
  <text x="592" y="114" fill="#92400e" font-size="13" font-weight="700" text-anchor="middle">MCP Server</text>
  <text x="592" y="132" fill="#64748b" font-size="10" text-anchor="middle">外部进程（s07）</text>
  <line x1="522" y1="142" x2="662" y2="142" stroke="#e2e8f0"/>
  <text x="592" y="164" fill="#475569" font-size="11" text-anchor="middle">compute_match</text>
  <text x="592" y="182" fill="#475569" font-size="11" text-anchor="middle">read_text_file</text>
  <text x="592" y="200" fill="#475569" font-size="11" text-anchor="middle">…任意新的工具</text>
  <text x="592" y="224" fill="#94a3b8" font-size="9" text-anchor="middle">换 Server = 换一整套能力</text>

  <!-- 三个收益 -->
  <rect x="80" y="280" width="180" height="100" rx="10" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
  <text x="170" y="304" fill="#166534" font-size="12" font-weight="700" text-anchor="middle">① 工具即插件</text>
  <text x="170" y="326" fill="#475569" font-size="10" text-anchor="middle">加能力=加 Server</text>
  <text x="170" y="344" fill="#64748b" font-size="9" text-anchor="middle">Agent 代码零改动</text>

  <rect x="280" y="280" width="180" height="100" rx="10" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
  <text x="370" y="304" fill="#166534" font-size="12" font-weight="700" text-anchor="middle">② 故障隔离</text>
  <text x="370" y="326" fill="#475569" font-size="10" text-anchor="middle">工具跑在独立进程</text>
  <text x="370" y="344" fill="#64748b" font-size="9" text-anchor="middle">崩了不拖垮主循环</text>

  <rect x="480" y="280" width="180" height="100" rx="10" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
  <text x="570" y="304" fill="#166534" font-size="12" font-weight="700" text-anchor="middle">③ 生态互操作</text>
  <text x="570" y="326" fill="#475569" font-size="10" text-anchor="middle">任意 MCP 兼容服务</text>
  <text x="570" y="344" fill="#64748b" font-size="9" text-anchor="middle">即插即用的能力池</text>

  <text x="360" y="436" fill="#94a3b8" font-size="11" text-anchor="middle">本步还埋了参数兜底：model 可能把 arguments 传成字符串（s09 展开）</text>
  <text x="360" y="458" fill="#cbd5e1" font-size="10" text-anchor="middle">配套代码：learn-mini-agent/s08_mcp_agent_bridge/code.py</text>
</svg>