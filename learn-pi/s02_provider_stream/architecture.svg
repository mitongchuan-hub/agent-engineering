<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="500" viewBox="0 0 1040 500" role="img" aria-labelledby="title desc">
  <title id="title">Pi Provider event stream and partial message assembly</title>
  <desc id="desc">A provider pushes start, delta and done events into an event stream. The consumer receives updates while the assembler replaces the partial message with the final message.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#334155"/>
    </marker>
    <style>
      .box { fill: #f8fafc; stroke: #334155; stroke-width: 2; rx: 8; }
      .blue { fill: #e0f2fe; stroke: #0369a1; stroke-width: 2; rx: 8; }
      .green { fill: #ecfdf5; stroke: #047857; stroke-width: 2; rx: 8; }
      .amber { fill: #fffbeb; stroke: #b45309; stroke-width: 2; rx: 8; }
      .label { fill: #0f172a; font: 16px sans-serif; text-anchor: middle; }
      .small { fill: #475569; font: 13px sans-serif; text-anchor: middle; }
      .line { stroke: #334155; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .blue-line { stroke: #0369a1; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1040" height="500" fill="#ffffff"/>
  <text x="520" y="34" class="label" font-weight="bold">s02_provider_stream: incremental events and final result</text>

  <rect x="45" y="105" width="170" height="92" class="blue"/>
  <text x="130" y="140" class="label">Provider</text>
  <text x="130" y="164" class="small">streamSimple()</text>

  <rect x="290" y="80" width="205" height="142" class="box"/>
  <text x="392" y="119" class="label">EventStream</text>
  <text x="392" y="145" class="small">queue: start</text>
  <text x="392" y="166" class="small">delta ...</text>
  <text x="392" y="187" class="small">done / error</text>

  <rect x="570" y="105" width="190" height="92" class="amber"/>
  <text x="665" y="140" class="label">async iterator</text>
  <text x="665" y="164" class="small">实时消费事件</text>

  <rect x="835" y="80" width="160" height="142" class="green"/>
  <text x="915" y="119" class="label">Assembler</text>
  <text x="915" y="145" class="small">partial 替换</text>
  <text x="915" y="166" class="small">message_end</text>
  <text x="915" y="187" class="small">final authority</text>

  <path d="M215 151 H290" class="line"/>
  <path d="M495 151 H570" class="line"/>
  <path d="M760 151 H835" class="line"/>

  <rect x="290" y="315" width="205" height="76" class="green"/>
  <text x="392" y="348" class="label">result()</text>
  <text x="392" y="372" class="small">最终 AssistantMessage</text>

  <rect x="570" y="315" width="190" height="76" class="box"/>
  <text x="665" y="348" class="label">AgentContext</text>
  <text x="665" y="372" class="small">最后一条被替换</text>

  <path d="M392 222 V315" class="blue-line"/>
  <path d="M495 353 H570" class="line"/>
  <path d="M760 353 H915 V222" class="line"/>
  <text x="520" y="291" class="small">独立于事件消费的最终结果通道</text>

  <path d="M915 222 V260 H1030 V65 H915 V80" class="blue-line"/>
  <text x="1006" y="270" class="small" transform="rotate(-90 1006 270)">done/error 完成</text>
  <text x="520" y="450" class="small">完成事件仍会被消费；完成后 push 的事件被忽略。</text>
</svg>
