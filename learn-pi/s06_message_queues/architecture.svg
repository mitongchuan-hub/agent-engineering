<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="540" viewBox="0 0 1120 540" role="img" aria-labelledby="title desc">
  <title id="title">Pi steering and follow-up message queues</title>
  <desc id="desc">Steering messages are drained before the first request and after each turn, while follow-up messages are drained only after the agent would otherwise stop.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#334155"/>
    </marker>
    <style>
      .box { fill: #f8fafc; stroke: #334155; stroke-width: 2; rx: 8; }
      .blue { fill: #e0f2fe; stroke: #0369a1; stroke-width: 2; rx: 8; }
      .green { fill: #ecfdf5; stroke: #047857; stroke-width: 2; rx: 8; }
      .amber { fill: #fffbeb; stroke: #b45309; stroke-width: 2; rx: 8; }
      .purple { fill: #f5f3ff; stroke: #6d28d9; stroke-width: 2; rx: 8; }
      .label { fill: #0f172a; font: 15px sans-serif; text-anchor: middle; }
      .small { fill: #475569; font: 12px sans-serif; text-anchor: middle; }
      .line { stroke: #334155; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .blue-line { stroke: #0369a1; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .purple-line { stroke: #6d28d9; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1120" height="540" fill="#ffffff"/>
  <text x="560" y="34" class="label" font-weight="bold">s06_message_queues: steering now, follow-up later</text>

  <rect x="35" y="95" width="165" height="75" class="blue"/>
  <text x="117" y="126" class="label">steer()</text>
  <text x="117" y="150" class="small">临时方向</text>
  <rect x="35" y="215" width="165" height="75" class="purple"/>
  <text x="117" y="246" class="label">followUp()</text>
  <text x="117" y="270" class="small">完成后追加</text>

  <rect x="260" y="95" width="175" height="75" class="blue"/>
  <text x="347" y="126" class="label">steering queue</text>
  <text x="347" y="150" class="small">all / one-at-a-time</text>
  <rect x="260" y="215" width="175" height="75" class="purple"/>
  <text x="347" y="246" class="label">follow-up queue</text>
  <text x="347" y="270" class="small">all / one-at-a-time</text>

  <rect x="510" y="125" width="200" height="110" class="amber"/>
  <text x="610" y="163" class="label">runLoop</text>
  <text x="610" y="188" class="small">tool/steering 内循环</text>
  <text x="610" y="210" class="small">自然停止后看 follow-up</text>

  <rect x="790" y="95" width="180" height="75" class="green"/>
  <text x="880" y="126" class="label">next provider turn</text>
  <text x="880" y="150" class="small">注入 steering</text>
  <rect x="790" y="265" width="180" height="75" class="purple"/>
  <text x="880" y="296" class="label">next outer turn</text>
  <text x="880" y="320" class="small">注入 follow-up</text>

  <path d="M200 132 H260" class="blue-line"/>
  <path d="M200 252 H260" class="purple-line"/>
  <path d="M435 132 H510" class="blue-line"/>
  <path d="M435 252 H480 V205 H510" class="purple-line"/>
  <path d="M710 160 H790" class="line"/>
  <path d="M710 210 H750 V302 H790" class="purple-line"/>

  <path d="M880 170 V205 H745 V125 H710" class="blue-line"/>
  <text x="795" y="198" class="small">turn 完成后 drain steering</text>
  <path d="M880 340 V405 H610 V235" class="purple-line"/>
  <text x="735" y="422" class="small">无 tool call / steering 后才 drain follow-up</text>

  <text x="560" y="495" class="small">当前 assistant 的 tool call 不能被 steering 跳过，必须先完成。</text>
</svg>
