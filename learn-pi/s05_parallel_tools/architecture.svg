<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
  <title id="title">Pi parallel tool execution and stable result order</title>
  <desc id="desc">Tool calls are preflighted in source order, prepared calls run in parallel, completion events arrive in completion order, and tool result messages are emitted in source order.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#334155"/>
    </marker>
    <style>
      .box { fill: #f8fafc; stroke: #334155; stroke-width: 2; rx: 8; }
      .blue { fill: #e0f2fe; stroke: #0369a1; stroke-width: 2; rx: 8; }
      .green { fill: #ecfdf5; stroke: #047857; stroke-width: 2; rx: 8; }
      .amber { fill: #fffbeb; stroke: #b45309; stroke-width: 2; rx: 8; }
      .label { fill: #0f172a; font: 15px sans-serif; text-anchor: middle; }
      .small { fill: #475569; font: 12px sans-serif; text-anchor: middle; }
      .line { stroke: #334155; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .blue-line { stroke: #0369a1; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .green-line { stroke: #047857; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1120" height="520" fill="#ffffff"/>
  <text x="560" y="34" class="label" font-weight="bold">s05_parallel_tools: completion order != result order</text>

  <rect x="35" y="100" width="165" height="82" class="blue"/>
  <text x="117" y="134" class="label">Assistant content</text>
  <text x="117" y="158" class="small">c1, c2, ...</text>

  <rect x="245" y="100" width="170" height="82" class="amber"/>
  <text x="330" y="134" class="label">Preflight</text>
  <text x="330" y="158" class="small">源码顺序</text>

  <rect x="465" y="70" width="180" height="75" class="green"/>
  <text x="555" y="102" class="label">Tool c1</text>
  <text x="555" y="126" class="small">慢</text>

  <rect x="465" y="165" width="180" height="75" class="green"/>
  <text x="555" y="197" class="label">Tool c2</text>
  <text x="555" y="221" class="small">快</text>

  <rect x="710" y="100" width="175" height="82" class="amber"/>
  <text x="797" y="134" class="label">execution_end</text>
  <text x="797" y="158" class="small">完成顺序: c2, c1</text>

  <rect x="950" y="100" width="140" height="82" class="blue"/>
  <text x="1020" y="134" class="label">toolResult</text>
  <text x="1020" y="158" class="small">源码顺序: c1, c2</text>

  <path d="M200 141 H245" class="line"/>
  <path d="M415 125 H465" class="line"/>
  <path d="M415 157 H465 V202" class="line"/>
  <path d="M645 202 H710" class="green-line"/>
  <path d="M645 107 H680 V141 H710" class="green-line"/>
  <path d="M885 141 H950" class="blue-line"/>

  <rect x="245" y="330" width="170" height="75" class="box"/>
  <text x="330" y="362" class="label">length stop</text>
  <text x="330" y="386" class="small">全部拒绝执行</text>

  <rect x="465" y="330" width="180" height="75" class="box"/>
  <text x="555" y="362" class="label">immediate outcome</text>
  <text x="555" y="386" class="small">错误 ToolResult</text>

  <path d="M330 182 V330" class="line"/>
  <path d="M415 367 H465" class="line"/>
  <text x="560" y="465" class="small">只有所有结果 terminate=true，batch 才提前结束。</text>
</svg>
