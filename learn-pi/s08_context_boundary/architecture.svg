<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
  <title id="title">Pi context transform and LLM conversion boundary</title>
  <desc id="desc">An Agent transcript is transformed first and converted second before being placed in an LLM context with system prompt and tools.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#334155"/>
    </marker>
    <style>
      .box { fill: #f8fafc; stroke: #334155; stroke-width: 2; rx: 8; }
      .blue { fill: #e0f2fe; stroke: #0369a1; stroke-width: 2; rx: 8; }
      .green { fill: #ecfdf5; stroke: #047857; stroke-width: 2; rx: 8; }
      .amber { fill: #fffbeb; stroke: #b45309; stroke-width: 2; rx: 8; }
      .label { fill: #0f172a; font: 15px sans-serif; text-anchor: middle; }
      .small { fill: #475569; font: 12px sans-serif; text-anchor: middle; }
      .line { stroke: #334155; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .blue-line { stroke: #0369a1; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .green-line { stroke: #047857; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1120" height="520" fill="#ffffff"/>
  <text x="560" y="34" class="label" font-weight="bold">s08_context_boundary: transcript != model context</text>

  <rect x="35" y="105" width="185" height="100" class="blue"/>
  <text x="127" y="143" class="label">AgentMessage[]</text>
  <text x="127" y="168" class="small">完整 transcript</text>
  <text x="127" y="188" class="small">custom / UI / summaries</text>

  <rect x="290" y="105" width="190" height="100" class="amber"/>
  <text x="385" y="143" class="label">transformContext</text>
  <text x="385" y="168" class="small">裁剪或注入</text>
  <text x="385" y="188" class="small">仍是 AgentMessage[]</text>

  <rect x="550" y="105" width="190" height="100" class="amber"/>
  <text x="645" y="143" class="label">convertToLlm</text>
  <text x="645" y="168" class="small">过滤和类型映射</text>
  <text x="645" y="188" class="small">变成 LLM Message[]</text>

  <rect x="810" y="80" width="260" height="150" class="green"/>
  <text x="940" y="119" class="label">LLMContext</text>
  <text x="940" y="147" class="small">system prompt</text>
  <text x="940" y="169" class="small">messages</text>
  <text x="940" y="191" class="small">tools</text>

  <path d="M220 155 H290" class="line"/>
  <path d="M480 155 H550" class="line"/>
  <path d="M740 155 H810" class="line"/>

  <rect x="290" y="330" width="190" height="78" class="box"/>
  <text x="385" y="363" class="label">notification</text>
  <text x="385" y="387" class="small">过滤，不发送给模型</text>

  <rect x="550" y="330" width="190" height="78" class="blue"/>
  <text x="645" y="363" class="label">custom / summary</text>
  <text x="645" y="387" class="small">映射成 user</text>

  <path d="M127 205 V275 H385 V330" class="line"/>
  <path d="M127 205 V250 H645 V330" class="blue-line"/>
  <text x="560" y="470" class="small">每次 Provider 请求都重新执行 transform 和 convert；transcript 本身不被替换。</text>
</svg>
