<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="520" viewBox="0 0 1080 520" role="img" aria-labelledby="title desc">
  <title id="title">Pi Agent event reducer and lifecycle</title>
  <desc id="desc">A low-level loop emits lifecycle events. The Agent reduces each event into state, then awaits subscribers. Agent end is emitted before the run becomes idle.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#334155"/>
    </marker>
    <style>
      .box { fill: #f8fafc; stroke: #334155; stroke-width: 2; rx: 8; }
      .blue { fill: #e0f2fe; stroke: #0369a1; stroke-width: 2; rx: 8; }
      .green { fill: #ecfdf5; stroke: #047857; stroke-width: 2; rx: 8; }
      .amber { fill: #fffbeb; stroke: #b45309; stroke-width: 2; rx: 8; }
      .label { fill: #0f172a; font: 16px sans-serif; text-anchor: middle; }
      .small { fill: #475569; font: 13px sans-serif; text-anchor: middle; }
      .line { stroke: #334155; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .blue-line { stroke: #0369a1; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1080" height="520" fill="#ffffff"/>
  <text x="540" y="34" class="label" font-weight="bold">s03_agent_events: event -&gt; state -&gt; subscribers</text>

  <rect x="45" y="105" width="200" height="100" class="blue"/>
  <text x="145" y="143" class="label">Low-level loop</text>
  <text x="145" y="168" class="small">AgentEvent sink</text>

  <rect x="310" y="82" width="230" height="146" class="box"/>
  <text x="425" y="121" class="label">Agent.processEvents</text>
  <text x="425" y="148" class="small">先归约状态</text>
  <text x="425" y="171" class="small">再通知 listeners</text>
  <text x="425" y="194" class="small">顺序 await</text>

  <rect x="605" y="105" width="190" height="100" class="green"/>
  <text x="700" y="143" class="label">AgentState</text>
  <text x="700" y="168" class="small">transcript / streaming</text>
  <text x="700" y="188" class="small">pending tools</text>

  <rect x="860" y="105" width="175" height="100" class="amber"/>
  <text x="947" y="143" class="label">Subscribers</text>
  <text x="947" y="168" class="small">UI / logger / persistence</text>

  <path d="M245 155 H310" class="line"/>
  <path d="M540 155 H605" class="line"/>
  <path d="M795 155 H860" class="line"/>

  <rect x="310" y="335" width="230" height="82" class="blue"/>
  <text x="425" y="369" class="label">agent_end</text>
  <text x="425" y="393" class="small">不等于 idle</text>

  <rect x="605" y="335" width="190" height="82" class="green"/>
  <text x="700" y="369" class="label">await listeners</text>
  <text x="700" y="393" class="small">is_streaming = true</text>

  <rect x="860" y="335" width="175" height="82" class="box"/>
  <text x="947" y="369" class="label">finishRun</text>
  <text x="947" y="393" class="small">idle / clear runtime</text>

  <path d="M425 228 V335" class="blue-line"/>
  <path d="M540 376 H605" class="line"/>
  <path d="M795 376 H860" class="line"/>
  <path d="M947 335 V265 H700 V205" class="blue-line"/>
  <text x="820" y="257" class="small">listener 完成后</text>

  <text x="540" y="475" class="small">message_end 写入 transcript；tool_execution_start/end 维护 pendingToolCalls。</text>
</svg>
