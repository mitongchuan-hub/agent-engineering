<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
  <title id="title">Pi agent end versus agent settled</title>
  <desc id="desc">The core Agent emits agent_end and waits for listeners before becoming idle. The higher-level AgentSession may retry, compact, or continue before emitting agent_settled.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#334155"/>
    </marker>
    <style>
      .box { fill: #f8fafc; stroke: #334155; stroke-width: 2; rx: 8; }
      .blue { fill: #e0f2fe; stroke: #0369a1; stroke-width: 2; rx: 8; }
      .green { fill: #ecfdf5; stroke: #047857; stroke-width: 2; rx: 8; }
      .amber { fill: #fffbeb; stroke: #b45309; stroke-width: 2; rx: 8; }
      .red { fill: #fef2f2; stroke: #b91c1c; stroke-width: 2; rx: 8; }
      .label { fill: #0f172a; font: 15px sans-serif; text-anchor: middle; }
      .small { fill: #475569; font: 12px sans-serif; text-anchor: middle; }
      .line { stroke: #334155; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .blue-line { stroke: #0369a1; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .green-line { stroke: #047857; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .red-line { stroke: #b91c1c; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1120" height="560" fill="#ffffff"/>
  <text x="560" y="34" class="label" font-weight="bold">s07_control_boundaries: end is not settled</text>

  <rect x="35" y="105" width="170" height="78" class="blue"/>
  <text x="120" y="137" class="label">Agent Loop</text>
  <text x="120" y="161" class="small">stop / error / abort</text>

  <rect x="275" y="105" width="175" height="78" class="amber"/>
  <text x="362" y="137" class="label">agent_end</text>
  <text x="362" y="161" class="small">no more loop events</text>

  <rect x="520" y="105" width="190" height="78" class="box"/>
  <text x="615" y="137" class="label">await listeners</text>
  <text x="615" y="161" class="small">core still streaming</text>

  <rect x="780" y="105" width="160" height="78" class="green"/>
  <text x="860" y="137" class="label">Core idle</text>
  <text x="860" y="161" class="small">finishRun</text>

  <path d="M205 144 H275" class="line"/>
  <path d="M450 144 H520" class="line"/>
  <path d="M710 144 H780" class="line"/>

  <rect x="275" y="320" width="175" height="78" class="red"/>
  <text x="362" y="352" class="label">retry</text>
  <text x="362" y="376" class="small">再次 Agent run</text>

  <rect x="520" y="320" width="190" height="78" class="amber"/>
  <text x="615" y="352" class="label">compaction</text>
  <text x="615" y="376" class="small">恢复上下文</text>

  <rect x="780" y="320" width="160" height="78" class="blue"/>
  <text x="860" y="352" class="label">continuation</text>
  <text x="860" y="376" class="small">队列续跑</text>

  <rect x="900" y="465" width="175" height="60" class="green"/>
  <text x="987" y="491" class="label">agent_settled</text>
  <text x="987" y="512" class="small">Session 真正稳定</text>

  <path d="M362 183 V320" class="red-line"/>
  <path d="M450 359 H520" class="line"/>
  <path d="M710 359 H780" class="line"/>
  <path d="M860 398 V495 H900" class="green-line"/>
  <text x="300" y="270" class="small">post-run action</text>
  <text x="740" y="450" class="small">无后处理时直接 settled</text>

  <path d="M940 183 V240 H1020 V320 H940" class="blue-line"/>
  <text x="1005" y="270" class="small" transform="rotate(-90 1005 270)">active</text>
  <text x="560" y="550" class="small">agent_end 可能是一次 Core run 的结束；agent_settled 才是 Session 的最终边界。</text>
</svg>
