<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="560" viewBox="0 0 1160 560" role="img" aria-labelledby="title desc">
  <title id="title">Pi context compaction and recovery</title>
  <desc id="desc">An assistant response is checked for overflow or threshold. A preparation selects a safe cut point, compaction writes a summary entry, context is rebuilt, and overflow retries once.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#334155"/>
    </marker>
    <style>
      .box { fill: #f8fafc; stroke: #334155; stroke-width: 2; rx: 8; }
      .blue { fill: #e0f2fe; stroke: #0369a1; stroke-width: 2; rx: 8; }
      .green { fill: #ecfdf5; stroke: #047857; stroke-width: 2; rx: 8; }
      .amber { fill: #fffbeb; stroke: #b45309; stroke-width: 2; rx: 8; }
      .red { fill: #fef2f2; stroke: #b91c1c; stroke-width: 2; rx: 8; }
      .label { fill: #0f172a; font: 15px sans-serif; text-anchor: middle; }
      .small { fill: #475569; font: 12px sans-serif; text-anchor: middle; }
      .line { stroke: #334155; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .green-line { stroke: #047857; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .red-line { stroke: #b91c1c; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1160" height="560" fill="#ffffff"/>
  <text x="580" y="34" class="label" font-weight="bold">s10_context_recovery: compact, rebuild, retry once</text>

  <rect x="35" y="100" width="175" height="82" class="blue"/>
  <text x="122" y="133" class="label">assistant response</text>
  <text x="122" y="157" class="small">stop / length / error</text>

  <rect x="255" y="100" width="180" height="82" class="amber"/>
  <text x="345" y="133" class="label">check context</text>
  <text x="345" y="157" class="small">threshold / overflow</text>

  <rect x="480" y="100" width="180" height="82" class="amber"/>
  <text x="570" y="133" class="label">prepareCompaction</text>
  <text x="570" y="157" class="small">safe cut point</text>

  <rect x="705" y="100" width="180" height="82" class="green"/>
  <text x="795" y="133" class="label">compaction entry</text>
  <text x="795" y="157" class="small">summary + firstKeptId</text>

  <rect x="930" y="100" width="190" height="82" class="blue"/>
  <text x="1025" y="133" class="label">rebuild context</text>
  <text x="1025" y="157" class="small">summary + kept tail</text>

  <path d="M210 141 H255" class="line"/>
  <path d="M435 141 H480" class="line"/>
  <path d="M660 141 H705" class="line"/>
  <path d="M885 141 H930" class="line"/>

  <rect x="255" y="320" width="180" height="82" class="red"/>
  <text x="345" y="353" class="label">aborted</text>
  <text x="345" y="377" class="small">跳过 compact/retry</text>

  <rect x="480" y="320" width="180" height="82" class="red"/>
  <text x="570" y="353" class="label">retry once</text>
  <text x="570" y="377" class="small">排除失败 assistant</text>

  <rect x="705" y="320" width="180" height="82" class="green"/>
  <text x="795" y="353" class="label">new turn</text>
  <text x="795" y="377" class="small">继续 Provider</text>

  <rect x="930" y="320" width="190" height="82" class="box"/>
  <text x="1025" y="353" class="label">second overflow</text>
  <text x="1025" y="377" class="small">报告失败，不再压缩</text>

  <path d="M345 182 V320" class="red-line"/>
  <path d="M795 182 V320" class="green-line"/>
  <path d="M885 361 H930" class="line"/>
  <path d="M570 402 V450 H1025 V402" class="red-line"/>
  <text x="570" y="440" class="small">overflow recovery attempted 标记</text>
  <text x="580" y="500" class="small">compaction 追加 entry，不删除旧 JSONL 历史。</text>
</svg>
