<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="550" viewBox="0 0 1160 550" role="img" aria-labelledby="title desc">
  <title id="title">Pi extension and resource boundary</title>
  <desc id="desc">An extension uses a narrow API to register tools and discover resource paths. The resource loader loads those paths and returns a snapshot to the runtime.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#334155"/>
    </marker>
    <style>
      .box { fill: #f8fafc; stroke: #334155; stroke-width: 2; rx: 8; }
      .blue { fill: #e0f2fe; stroke: #0369a1; stroke-width: 2; rx: 8; }
      .green { fill: #ecfdf5; stroke: #047857; stroke-width: 2; rx: 8; }
      .amber { fill: #fffbeb; stroke: #b45309; stroke-width: 2; rx: 8; }
      .red { fill: #fef2f2; stroke: #b91c1c; stroke-width: 2; rx: 8; }
      .label { fill: #0f172a; font: 15px sans-serif; text-anchor: middle; }
      .small { fill: #475569; font: 12px sans-serif; text-anchor: middle; }
      .line { stroke: #334155; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .green-line { stroke: #047857; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .red-line { stroke: #b91c1c; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1160" height="550" fill="#ffffff"/>
  <text x="580" y="34" class="label" font-weight="bold">s11_extension_boundary: discover, load, diagnose</text>

  <rect x="35" y="95" width="190" height="88" class="blue"/>
  <text x="130" y="129" class="label">Extension factory</text>
  <text x="130" y="154" class="small">register tool / on()</text>

  <rect x="280" y="95" width="185" height="88" class="amber"/>
  <text x="372" y="129" class="label">ExtensionAPI</text>
  <text x="372" y="154" class="small">session_start</text>

  <rect x="520" y="95" width="205" height="88" class="amber"/>
  <text x="622" y="129" class="label">resources_discover</text>
  <text x="622" y="154" class="small">extra paths</text>

  <rect x="780" y="95" width="180" height="88" class="green"/>
  <text x="870" y="129" class="label">ResourceLoader</text>
  <text x="870" y="154" class="small">skills / prompts / themes</text>

  <rect x="1015" y="95" width="110" height="88" class="blue"/>
  <text x="1070" y="129" class="label">snapshot</text>
  <text x="1070" y="154" class="small">runtime input</text>

  <path d="M225 139 H280" class="line"/>
  <path d="M465 139 H520" class="line"/>
  <path d="M725 139 H780" class="green-line"/>
  <path d="M960 139 H1015" class="line"/>

  <rect x="280" y="325" width="185" height="80" class="box"/>
  <text x="372" y="358" class="label">tool pool</text>
  <text x="372" y="382" class="small">LLM-callable tools</text>

  <rect x="520" y="325" width="205" height="80" class="box"/>
  <text x="622" y="358" class="label">context files</text>
  <text x="622" y="382" class="small">AGENTS / CLAUDE</text>

  <rect x="780" y="325" width="180" height="80" class="red"/>
  <text x="870" y="358" class="label">diagnostics</text>
  <text x="870" y="382" class="small">failure isolation</text>

  <path d="M372 183 V325" class="line"/>
  <path d="M870 183 V325" class="red-line"/>
  <path d="M622 183 V325" class="line"/>
  <text x="560" y="470" class="small">扩展返回资源路径，加载器负责读取；核心 Agent Loop 不被扩展实现替换。</text>
</svg>
