<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" font-family="system-ui, 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
    <marker id="arrow-d" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
    <linearGradient id="hd" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e3a5f"/><stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>
  <rect width="720" height="480" fill="#fafbfc" rx="8"/>
  <rect x="0" y="0" width="720" height="48" fill="url(#hd)" rx="8"/>
  <rect x="0" y="40" width="720" height="8" fill="url(#hd)"/>
  <text x="360" y="31" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">Hooks — 执行瞬间的拦截与改写</text>

  <!-- 命令流 -->
  <rect x="40" y="90" width="200" height="60" rx="10" fill="#f0f4ff" stroke="#2563eb" stroke-width="2"/>
  <text x="140" y="114" fill="#1e3a5f" font-size="12" font-weight="700" text-anchor="middle">工具调用</text>
  <text x="140" y="136" fill="#64748b" font-size="9" text-anchor="middle">grep -r 'TODO' src</text>

  <line x1="240" y1="120" x2="300" y2="120" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 钩子链 -->
  <rect x="302" y="80" width="280" height="220" rx="10" fill="#fff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="442" y="104" fill="#1e3a5f" font-size="13" font-weight="700" text-anchor="middle">PreToolUse 钩子链</text>
  <line x1="322" y1="114" x2="562" y2="114" stroke="#e2e8f0"/>
  <rect x="322" y="126" width="240" height="60" rx="8" fill="#fff8f0" stroke="#d97706" stroke-width="1.5"/>
  <text x="442" y="148" fill="#92400e" font-size="11" font-weight="700" text-anchor="middle">validator 钩子</text>
  <text x="442" y="170" fill="#475569" font-size="9" text-anchor="middle">✏️ 改写：grep → rg</text>
  <text x="442" y="184" fill="#475569" font-size="9" text-anchor="middle">🚫 deny：危险前缀</text>
  <text x="442" y="210" fill="#94a3b8" font-size="8" text-anchor="middle">真实参考：bash_command_validator_example.py</text>
  <text x="442" y="244" fill="#94a3b8" font-size="8" text-anchor="middle">决策四态：allow / deny / ask / edit</text>

  <line x1="582" y1="190" x2="630" y2="190" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 决策 -->
  <rect x="632" y="160" width="70" height="140" rx="10" fill="#fff8f0" stroke="#d97706" stroke-width="1.5"/>
  <text x="667" y="184" fill="#92400e" font-size="9" font-weight="700" text-anchor="middle" transform="rotate(90,667,184)">决策</text>
  <text x="667" y="234" fill="#475569" font-size="8" text-anchor="middle">allow/</text>
  <text x="667" y="248" fill="#475569" font-size="8" text-anchor="middle">deny/</text>
  <text x="667" y="262" fill="#475569" font-size="8" text-anchor="middle">ask/edit</text>
  <text x="667" y="290" fill="#94a3b8" font-size="7" text-anchor="middle">→执行/拦/问</text>

  <!-- 拒绝示例 -->
  <line x1="322" y1="220" x2="180" y2="330" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-d)" stroke-dasharray="5,3"/>
  <rect x="40" y="332" width="260" height="80" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="170" y="356" fill="#b91c1c" font-size="12" font-weight="700" text-anchor="middle">🚫 rm -rf / 重要目录</text>
  <text x="170" y="378" fill="#64748b" font-size="9" text-anchor="middle">钩子 deny → 拦下（不执行）</text>
  <text x="170" y="398" fill="#94a3b8" font-size="8" text-anchor="middle">白名单之外的第二道防线</text>

  <!-- 改写示例 -->
  <rect x="380" y="332" width="300" height="80" rx="10" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
  <text x="530" y="356" fill="#166534" font-size="12" font-weight="700" text-anchor="middle">✏️ grep → rg（改写后执行）</text>
  <text x="530" y="378" fill="#64748b" font-size="9" text-anchor="middle">保留语义，换更快实现</text>
  <text x="530" y="398" fill="#94a3b8" font-size="8" text-anchor="middle">真实示例就是对 grep 的替换</text>

  <text x="360" y="452" fill="#94a3b8" font-size="11" text-anchor="middle">白名单锁死"能碰什么"（x02），钩子拦截"这次怎么跑"（x04）——两道独立防线</text>
  <text x="360" y="474" fill="#cbd5e1" font-size="9" text-anchor="middle">配套代码：agent-source/claude_learn/x04_hooks/code.py ｜ 原版：examples/hooks/</text>
</svg>