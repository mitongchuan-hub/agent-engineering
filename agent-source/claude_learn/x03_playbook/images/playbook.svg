<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" font-family="system-ui, 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
    <linearGradient id="hd" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e3a5f"/><stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>
  <rect width="720" height="480" fill="#fafbfc" rx="8"/>
  <rect x="0" y="0" width="720" height="48" fill="url(#hd)" rx="8"/>
  <rect x="0" y="40" width="720" height="8" fill="url(#hd)"/>
  <text x="360" y="31" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">Playbook — 成本分层 + 并行编排</text>

  <!-- 剧本 -->
  <rect x="40" y="90" width="260" height="200" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="170" y="114" fill="#334155" font-size="12" font-weight="700" text-anchor="middle">命令正文 = 剧本</text>
  <line x1="60" y1="124" x2="280" y2="124" stroke="#e2e8f0"/>
  <text x="170" y="148" fill="#475569" font-size="10" text-anchor="middle">1. haiku：检查 PR 可评审?</text>
  <text x="170" y="170" fill="#475569" font-size="10" text-anchor="middle">2. haiku：收集 CLAUDE.md 清单</text>
  <text x="170" y="192" fill="#475569" font-size="10" text-anchor="middle">3. sonnet：总结 PR 变更</text>
  <text x="170" y="214" fill="#475569" font-size="10" text-anchor="middle">4. sonnet×4：并行独立评审</text>
  <text x="170" y="252" fill="#94a3b8" font-size="9" text-anchor="middle">真实样例：plugins/code-review/commands/</text>
  <text x="170" y="272" fill="#94a3b8" font-size="9" text-anchor="middle">（正文即软件，执行靠模型）</text>

  <line x1="300" y1="190" x2="420" y2="190" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 调度模型 -->
  <rect x="422" y="80" width="270" height="150" rx="10" fill="#fff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="557" y="104" fill="#1e3a5f" font-size="12" font-weight="700" text-anchor="middle">成本分层调度器</text>
  <line x1="442" y1="114" x2="672" y2="114" stroke="#e2e8f0"/>
  <rect x="442" y="126" width="116" height="54" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.5"/>
  <text x="500" y="146" fill="#166534" font-size="11" font-weight="700" text-anchor="middle">haiku</text>
  <text x="500" y="164" fill="#64748b" font-size="8" text-anchor="middle">便宜 · 轻活 · 预检</text>
  <rect x="442" y="184" width="116" height="42" rx="8" fill="#fff8f0" stroke="#d97706" stroke-width="1.5"/>
  <text x="500" y="204" fill="#92400e" font-size="11" font-weight="700" text-anchor="middle">sonnet</text>
  <text x="500" y="220" fill="#64748b" font-size="8" text-anchor="middle">贵 10× · 重活 · 评审</text>
  <rect x="568" y="126" width="100" height="50" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="618" y="146" fill="#334155" font-size="10" font-weight="700" text-anchor="middle">并行×4</text>
  <text x="618" y="164" fill="#94a3b8" font-size="8" text-anchor="middle">互相独立</text>

  <!-- 成本 -->
  <rect x="120" y="300" width="480" height="100" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="360" y="324" fill="#92400e" font-size="12" font-weight="700" text-anchor="middle">成本对比（模拟输出）</text>
  <text x="360" y="348" fill="#475569" font-size="10" text-anchor="middle">分层：haiku 预检 + sonnet 重活 + ×4 并行  ≈ $0.86</text>
  <text x="360" y="368" fill="#475569" font-size="10" text-anchor="middle">全贵：全部 sonnet（照跑）         ≈ $1.52（贵 ~77%）</text>
  <text x="360" y="388" fill="#94a3b8" font-size="9" text-anchor="middle">并行的额外收益：耗时≈最慢单次（时间侧也省）</text>

  <text x="360" y="446" fill="#94a3b8" font-size="11" text-anchor="middle">分层 = 便宜模型趟量大的活，贵模型啃硬骨头——成本立省一大截</text>
  <text x="360" y="470" fill="#cbd5e1" font-size="9" text-anchor="middle">配套代码：agent-source/claude_learn/x03_playbook/code.py ｜ 原版：code-review.md</text>
</svg>