<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" font-family="system-ui, 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
    <linearGradient id="hd" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e3a5f"/><stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>
  <rect width="720" height="480" fill="#fafbfc" rx="8"/>
  <rect x="0" y="0" width="720" height="48" fill="url(#hd)" rx="8"/>
  <rect x="0" y="40" width="720" height="8" fill="url(#hd)"/>
  <text x="360" y="31" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">Plugin = Manifest + Commands</text>

  <!-- 插件目录 -->
  <rect x="40" y="90" width="280" height="180" rx="10" fill="#f0f4ff" stroke="#2563eb" stroke-width="2"/>
  <text x="180" y="114" fill="#1e3a5f" font-size="12" font-weight="700" text-anchor="middle">插件目录（如 code-review/）</text>
  <line x1="60" y1="124" x2="300" y2="124" stroke="#e2e8f0"/>
  <rect x="55" y="138" width="250" height="40" rx="6" fill="#fff" stroke="#d97706" stroke-width="1.5"/>
  <text x="180" y="156" fill="#92400e" font-size="11" font-weight="700" text-anchor="middle">.claude-plugin/plugin.json</text>
  <text x="180" y="172" fill="#94a3b8" font-size="8" text-anchor="middle">身份证：name/description/version/author</text>
  <rect x="55" y="186" width="250" height="40" rx="6" fill="#fff"/>
  <text x="180" y="204" fill="#475569" font-size="11" text-anchor="middle">commands/*.md</text>
  <text x="180" y="220" fill="#94a3b8" font-size="8" text-anchor="middle">办事清单：能力入口</text>
  <text x="180" y="250" fill="#94a3b8" font-size="9" text-anchor="middle">真实样例：plugins/code-review（manifest + commands/code-review.md）</text>

  <line x1="320" y1="180" x2="370" y2="180" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 加载器 -->
  <rect x="372" y="140" width="180" height="90" rx="10" fill="#fff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="462" y="166" fill="#1e3a5f" font-size="13" font-weight="700" text-anchor="middle">PluginLoader</text>
  <line x1="392" y1="176" x2="532" y2="176" stroke="#e2e8f0"/>
  <text x="462" y="198" fill="#475569" font-size="10" text-anchor="middle">解析 manifest</text>
  <text x="462" y="216" fill="#475569" font-size="10" text-anchor="middle">扫描 commands 目录</text>

  <line x1="552" y1="185" x2="590" y2="185" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 输出 -->
  <rect x="592" y="140" width="110" height="140" rx="10" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
  <text x="647" y="166" fill="#166534" font-size="12" font-weight="700" text-anchor="middle" transform="rotate(90,647,166)">能力清单</text>
  <text x="647" y="210" fill="#475569" font-size="9" text-anchor="middle">插件+命令</text>
  <text x="647" y="228" fill="#475569" font-size="9" text-anchor="middle">+描述+权限</text>
  <text x="647" y="246" fill="#475569" font-size="9" text-anchor="middle">+正文行数</text>

  <!-- YAML 头 -->
  <rect x="120" y="300" width="480" height="100" rx="10" fill="#fff8f0" stroke="#d97706" stroke-width="2"/>
  <text x="360" y="322" fill="#92400e" font-size="12" font-weight="700" text-anchor="middle">commands/*.md 的 YAML 头（接口规格）</text>
  <text x="360" y="348" fill="#475569" font-size="10" text-anchor="middle">---</text>
  <text x="360" y="368" fill="#475569" font-size="10" text-anchor="middle">allowed-tools: Bash(gh pr view:*), mcp__github_inline_comment__* ← 下章主角</text>
  <text x="360" y="388" fill="#475569" font-size="10" text-anchor="middle">description: Code review a pull request</text>

  <text x="360" y="446" fill="#94a3b8" font-size="11" text-anchor="middle">"提示词即软件"第一层：能力用数据描述，引擎只负责加载</text>
  <text x="360" y="470" fill="#cbd5e1" font-size="9" text-anchor="middle">配套代码：agent-source/claude_learn/x01_plugin_manifest/code.py ｜ 原版：plugins/code-review</text>
</svg>