<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" font-family="system-ui, 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
    <linearGradient id="hd" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e3a5f"/><stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>
  <rect width="720" height="480" fill="#fafbfc" rx="8"/>
  <rect x="0" y="0" width="720" height="48" fill="url(#hd)" rx="8"/>
  <rect x="0" y="40" width="720" height="8" fill="url(#hd)"/>
  <text x="360" y="31" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">Commands — /命令 即能力入口</text>

  <!-- 用户输入 -->
  <rect x="40" y="90" width="200" height="70" rx="10" fill="#f0f4ff" stroke="#2563eb" stroke-width="2"/>
  <text x="140" y="114" fill="#1e3a5f" font-size="13" font-weight="700" text-anchor="middle">用户在 CLI 输入</text>
  <text x="140" y="138" fill="#475569" font-size="11" text-anchor="middle">/triage-issue --issue=42</text>

  <line x1="240" y1="125" x2="300" y2="125" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 注册表 -->
  <rect x="302" y="90" width="200" height="190" rx="10" fill="#fff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="402" y="114" fill="#1e3a5f" font-size="13" font-weight="700" text-anchor="middle">CommandRegistry</text>
  <line x1="322" y1="124" x2="482" y2="124" stroke="#e2e8f0"/>
  <text x="402" y="148" fill="#475569" font-size="10" text-anchor="middle">triage-issue</text>
  <text x="402" y="168" fill="#475569" font-size="10" text-anchor="middle">commit-push-pr</text>
  <text x="402" y="188" fill="#475569" font-size="10" text-anchor="middle">…（md 文件即命令）</text>
  <text x="402" y="220" fill="#64748b" font-size="9" text-anchor="middle">加能力=放一个 md</text>
  <text x="402" y="240" fill="#64748b" font-size="9" text-anchor="middle">注册自动完成</text>
  <text x="402" y="262" fill="#94a3b8" font-size="8" text-anchor="middle">→ 解析 YAML 头+正文</text>

  <line x1="502" y1="185" x2="550" y2="185" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 执行视角 -->
  <rect x="552" y="130" width="140" height="110" rx="10" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
  <text x="622" y="156" fill="#166534" font-size="11" font-weight="700" text-anchor="middle" transform="rotate(90,622,156)">执行视角</text>
  <text x="622" y="200" fill="#475569" font-size="9" text-anchor="middle">描述（干什么）</text>
  <text x="622" y="218" fill="#475569" font-size="9" text-anchor="middle">权限（allowed）</text>
  <text x="622" y="236" fill="#475569" font-size="9" text-anchor="middle">正文（剧本）</text>

  <!-- 底行 -->
  <rect x="60" y="330" width="600" height="96" rx="10" fill="#fff8f0" stroke="#d97706" stroke-width="2"/>
  <text x="360" y="354" fill="#92400e" font-size="12" font-weight="700" text-anchor="middle">"提示词即软件"的第三层：能力是数据，解释器是引擎</text>
  <text x="360" y="380" fill="#475569" font-size="10" text-anchor="middle">CLI 层：/命令 [参数] → 加载定义 → 汇报将干什么 → 交 x03 调度</text>
  <text x="360" y="404" fill="#64748b" font-size="9" text-anchor="middle">未知命令 → 提示可用列表（友好失败）</text>
  <text x="360" y="420" fill="#cbd5e1" font-size="8" text-anchor="middle">真实样例（.claude/commands）：commit-push-pr / dedupe / triage-issue</text>

  <text x="360" y="470" fill="#cbd5e1" font-size="9" text-anchor="middle">配套代码：agent-source/claude_learn/x05_commands/code.py ｜ 原版：.claude/commands/*</text>
</svg>