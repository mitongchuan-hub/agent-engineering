<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" font-family="system-ui, 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
    <linearGradient id="hd" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e3a5f"/><stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>
  <rect width="720" height="500" fill="#fafbfc" rx="8"/>
  <rect x="0" y="0" width="720" height="48" fill="url(#hd)" rx="8"/>
  <rect x="0" y="40" width="720" height="8" fill="url(#hd)"/>
  <text x="360" y="31" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">Steering — 用户中途插话不丢</text>

  <!-- 用户 -->
  <rect x="40" y="90" width="200" height="90" rx="10" fill="#f0f4ff" stroke="#2563eb" stroke-width="2"/>
  <text x="140" y="114" fill="#1e3a5f" font-size="13" font-weight="700" text-anchor="middle">用户（插话）</text>
  <text x="140" y="138" fill="#475569" font-size="10" text-anchor="middle">"先把上一版结论发我"</text>
  <text x="140" y="158" fill="#94a3b8" font-size="8" text-anchor="middle">Agent 正在干第 1 轮</text>

  <line x1="240" y1="135" x2="300" y2="135" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- SteeringQueue -->
  <rect x="302" y="100" width="200" height="70" rx="10" fill="#fff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="402" y="126" fill="#1e3a5f" font-size="13" font-weight="700" text-anchor="middle">SteeringQueue</text>
  <text x="402" y="150" fill="#64748b" font-size="9" text-anchor="middle">排队 · 等待注入（不丢）</text>
  <text x="402" y="164" fill="#94a3b8" font-size="8" text-anchor="middle">对应 getSteeringMessages()</text>

  <line x1="502" y1="135" x2="550" y2="135" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 主循环 -->
  <rect x="552" y="100" width="150" height="210" rx="10" fill="#fff8f0" stroke="#d97706" stroke-width="2"/>
  <text x="627" y="126" fill="#92400e" font-size="12" font-weight="700" text-anchor="middle">外层 while</text>
  <line x1="568" y1="136" x2="686" y2="136" stroke="#e2e8f0"/>
  <text x="627" y="160" fill="#475569" font-size="10" text-anchor="middle">每轮开头拉取</text>
  <text x="627" y="178" fill="#475569" font-size="10" text-anchor="middle">steering 消息</text>
  <text x="627" y="202" fill="#64748b" font-size="9" text-anchor="middle">有 → 注入 messages</text>
  <text x="627" y="222" fill="#64748b" font-size="9" text-anchor="middle">→ 下一轮先处理</text>
  <text x="627" y="246" fill="#64748b" font-size="9" text-anchor="middle">无 → 正常回合</text>
  <text x="627" y="280" fill="#94a3b8" font-size="8" text-anchor="middle">压缩/长准备期也轮询</text>
  <text x="627" y="298" fill="#94a3b8" font-size="8" text-anchor="middle">→ 插话永不丢</text>

  <!-- 消息流 -->
  <line x1="402" y1="170" x2="402" y2="300" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="220" y="302" width="280" height="130" rx="10" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
  <text x="360" y="328" fill="#166534" font-size="12" font-weight="700" text-anchor="middle">messages（因果链连续）</text>
  <line x1="240" y1="338" x2="480" y2="338" stroke="#d1fae5"/>
  <text x="360" y="360" fill="#475569" font-size="10" text-anchor="middle">user: 任务</text>
  <text x="360" y="378" fill="#475569" font-size="10" text-anchor="middle">assistant: 第1轮… (工作到一半)</text>
  <rect x="240" y="386" width="240" height="32" rx="6" fill="#fff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="360" y="406" fill="#166534" font-size="10" font-weight="700" text-anchor="middle">★ steering 注入（下一步先处理）</text>
  <text x="360" y="422" fill="#94a3b8" font-size="8" text-anchor="middle">顺序 = 任务 → 插话 → 继续，因果不断</text>

  <text x="360" y="476" fill="#94a3b8" font-size="11" text-anchor="middle">对比"打断即清空"：steering 保顺序又即时生效</text>
  <text x="360" y="498" fill="#cbd5e1" font-size="10" text-anchor="middle">配套代码：agent-source/pi_learn/p02_steering/code.py</text>
</svg>