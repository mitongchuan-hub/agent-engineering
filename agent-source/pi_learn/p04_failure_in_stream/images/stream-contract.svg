<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" font-family="system-ui, 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
    <linearGradient id="hd" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e3a5f"/><stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>
  <rect width="720" height="480" fill="#fafbfc" rx="8"/>
  <rect x="0" y="0" width="720" height="48" fill="url(#hd)" rx="8"/>
  <rect x="0" y="40" width="720" height="8" fill="url(#hd)"/>
  <text x="360" y="31" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">Failure in Stream — 失败是流里的一个事件</text>

  <!-- 三种流 -->
  <rect x="40" y="90" width="200" height="110" rx="10" fill="#f0f4ff" stroke="#2563eb" stroke-width="2"/>
  <text x="140" y="114" fill="#1e3a5f" font-size="13" font-weight="700" text-anchor="middle">三种"流"</text>
  <line x1="60" y1="124" x2="220" y2="124" stroke="#e2e8f0"/>
  <text x="140" y="148" fill="#475569" font-size="10" text-anchor="middle">正常 → stop</text>
  <text x="140" y="168" fill="#b91c1c" font-size="10" text-anchor="middle">网络错误 → error</text>
  <text x="140" y="186" fill="#d97706" font-size="10" text-anchor="middle">Ctrl+C → aborted</text>

  <line x1="240" y1="145" x2="300" y2="145" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 流模型 -->
  <rect x="302" y="90" width="200" height="190" rx="10" fill="#fff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="402" y="114" fill="#1e3a5f" font-size="13" font-weight="700" text-anchor="middle">StreamFn 契约</text>
  <line x1="322" y1="124" x2="482" y2="124" stroke="#e2e8f0"/>
  <text x="402" y="148" fill="#475569" font-size="10" text-anchor="middle">模型调用 = 返回一个"流"</text>
  <text x="402" y="170" fill="#64748b" font-size="9" text-anchor="middle">流里有事件（delta / error / aborted）</text>
  <text x="402" y="196" fill="#92400e" font-size="10" font-weight="700" text-anchor="middle">契约：不得抛异常！</text>
  <text x="402" y="216" fill="#475569" font-size="10" text-anchor="middle">失败必须编码进流</text>
  <text x="402" y="236" fill="#94a3b8" font-size="8" text-anchor="middle">最终消息带 stopReason</text>

  <line x1="502" y1="185" x2="550" y2="185" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 消费端 -->
  <rect x="552" y="140" width="140" height="90" rx="10" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
  <text x="622" y="166" fill="#166534" font-size="12" font-weight="700" text-anchor="middle">消费端</text>
  <line x1="568" y1="176" x2="676" y2="176" stroke="#d1fae5"/>
  <text x="622" y="198" fill="#475569" font-size="9" text-anchor="middle">不 try/except</text>
  <text x="622" y="216" fill="#475569" font-size="9" text-anchor="middle">按 stopReason 分支</text>

  <!-- 对比 -->
  <rect x="120" y="330" width="480" height="92" rx="10" fill="#fff8f0" stroke="#d97706" stroke-width="1.5"/>
  <text x="360" y="354" fill="#92400e" font-size="11" font-weight="700" text-anchor="middle">对比（记住这张表）</text>
  <text x="360" y="378" fill="#475569" font-size="10" text-anchor="middle">传统：try/except 抛 LLMError（我们的 s09）—— catch 后摸黑</text>
  <text x="360" y="400" fill="#475569" font-size="10" text-anchor="middle">pi　：失败编码进流（stopReason）—— UI 显原因，逻辑看分支</text>

  <text x="360" y="452" fill="#94a3b8" font-size="11" text-anchor="middle">UI 增量渲染 + 错误可视化；重试/\尊重中断/报错 —— 都由 stopReason 驱动</text>
  <text x="360" y="474" fill="#cbd5e1" font-size="10" text-anchor="middle">配套代码：agent-source/pi_learn/p04_failure_in_stream/code.py ｜ 原版：types.ts StreamFn</text>
</svg>