<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" font-family="system-ui, 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
    <linearGradient id="hd" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e3a5f"/><stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>
  <rect width="720" height="500" fill="#fafbfc" rx="8"/>
  <rect x="0" y="0" width="720" height="48" fill="url(#hd)" rx="8"/>
  <rect x="0" y="40" width="720" height="8" fill="url(#hd)"/>
  <text x="360" y="31" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">JSONL 会话 — 带 codec 的存档</text>

  <!-- 写 -->
  <rect x="40" y="90" width="200" height="150" rx="10" fill="#f0f4ff" stroke="#2563eb" stroke-width="2"/>
  <text x="140" y="114" fill="#1e3a5f" font-size="13" font-weight="700" text-anchor="middle">v1 时代写文件</text>
  <text x="140" y="138" fill="#475569" font-size="10" text-anchor="middle">append：user/assistant/tool</text>
  <text x="140" y="158" fill="#475569" font-size="10" text-anchor="middle">每行一个 JSON，带 v 版本</text>
  <text x="140" y="182" fill="#94a3b8" font-size="9" text-anchor="middle">CodecV1.encode 包版本号</text>
  <text x="140" y="210" fill="#94a3b8" font-size="9" text-anchor="middle">"刚才那行是我 v1 写的"</text>

  <line x1="240" y1="165" x2="300" y2="165" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 文件 -->
  <rect x="302" y="90" width="216" height="300" rx="10" fill="#fff" stroke="#16a34a" stroke-width="2.5"/>
  <text x="410" y="116" fill="#166534" font-size="13" font-weight="700" text-anchor="middle">session.jsonl</text>
  <line x1="322" y1="126" x2="498" y2="126" stroke="#e2e8f0"/>
  <rect x="318" y="138" width="184" height="26" rx="5" fill="#f8fafc"/>
  <text x="410" y="156" fill="#64748b" font-size="9" text-anchor="middle">{"v":1,...,"content":"实现登录"}</text>
  <rect x="318" y="168" width="184" height="26" rx="5" fill="#f8fafc"/>
  <text x="410" y="186" fill="#64748b" font-size="9" text-anchor="middle">{"v":1,...,"content":"JWT 方案"}</text>
  <rect x="318" y="198" width="184" height="26" rx="5" fill="#fef2f2"/>
  <text x="410" y="216" fill="#b91c1c" font-size="9" text-anchor="middle">{破损的半个 JSON  ← 崩溃残留</text>
  <rect x="318" y="244" width="184" height="26" rx="5" fill="#f8fafc"/>
  <text x="410" y="262" fill="#64748b" font-size="9" text-anchor="middle">{"v":2,...,"marker":"v2"}</text>
  <text x="410" y="320" fill="#94a3b8" font-size="8" text-anchor="middle">新版本 append，新旧混存</text>
  <text x="410" y="342" fill="#94a3b8" font-size="8" text-anchor="middle">追加写 · 行独立 · 坏行可跳</text>
  <text x="410" y="366" fill="#94a3b8" font-size="8" text-anchor="middle">版本号在行内 = 随时知道谁写的</text>

  <line x1="518" y1="230" x2="562" y2="230" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 读 / 迁移 -->
  <rect x="564" y="120" width="136" height="220" rx="10" fill="#fff8f0" stroke="#d97706" stroke-width="2"/>
  <text x="632" y="146" fill="#92400e" font-size="11" font-weight="700" text-anchor="middle" transform="rotate(90,632,150)">CodecV2.load</text>
  <text x="632" y="220" fill="#475569" font-size="9" text-anchor="middle">坏行跳过</text>
  <text x="632" y="238" fill="#475569" font-size="9" text-anchor="middle">v1 行读为 v1 语义</text>
  <text x="632" y="256" fill="#475569" font-size="9" text-anchor="middle">缺字段补默认值</text>
  <text x="632" y="278" fill="#94a3b8" font-size="8" text-anchor="middle">→ 旧会话救得回来</text>
  <text x="632" y="296" fill="#94a3b8" font-size="8" text-anchor="middle">（向后兼容）</text>

  <!-- 底部 -->
  <rect x="120" y="416" width="480" height="60" rx="10" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
  <text x="360" y="440" fill="#166534" font-size="11" font-weight="700" text-anchor="middle">codec 价值：版本号随文件写 · 向后兼容 · 坏行可跳 = 格式可演进不碎档</text>
  <text x="360" y="464" fill="#cbd5e1" font-size="8" text-anchor="middle">对比 c06：多了一层"版本与迁移"，老会话被新版本打开也不崩</text>
  <text x="360" y="494" fill="#cbd5e1" font-size="9" text-anchor="middle">配套代码：agent-source/pi_learn/p07_session_jsonl/code.py</text>
</svg>