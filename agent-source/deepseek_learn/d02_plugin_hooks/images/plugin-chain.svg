<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" font-family="system-ui, 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
    <marker id="arrow-c" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
    <linearGradient id="hd" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e3a5f"/><stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>
  <rect width="720" height="500" fill="#fafbfc" rx="8"/>
  <rect x="0" y="0" width="720" height="48" fill="url(#hd)" rx="8"/>
  <rect x="0" y="40" width="720" height="8" fill="url(#hd)"/>
  <text x="360" y="31" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">Plugin Hooks — waterfall 水流式改写</text>

  <!-- 触发点 -->
  <rect x="40" y="88" width="180" height="70" rx="10" fill="#f0f4ff" stroke="#2563eb" stroke-width="2"/>
  <text x="130" y="112" fill="#1e3a5f" font-size="12" font-weight="700" text-anchor="middle">agent/pre-step</text>
  <text x="130" y="134" fill="#64748b" font-size="9" text-anchor="middle">每次调模型前·必经点</text>

  <line x1="220" y1="123" x2="268" y2="123" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 插件链 -->
  <rect x="270" y="70" width="410" height="180" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="475" y="94" fill="#1e3a5f" font-size="13" font-weight="700" text-anchor="middle">插件链（按 order 排序）</text>
  <line x1="290" y1="104" x2="660" y2="104" stroke="#e2e8f0"/>

  <rect x="295" y="116" width="112" height="66" rx="8" fill="#fff8f0" stroke="#d97706" stroke-width="1.5"/>
  <text x="351" y="136" fill="#92400e" font-size="11" font-weight="700" text-anchor="middle">SecurityGuard</text>
  <text x="351" y="156" fill="#64748b" font-size="9" text-anchor="middle">order=10</text>
  <text x="351" y="172" fill="#b91c1c" font-size="8" text-anchor="middle">敏感词→block</text>

  <line x1="407" y1="149" x2="425" y2="149" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="427" y="116" width="112" height="66" rx="8" fill="#f0f4ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="483" y="136" fill="#1e3a5f" font-size="11" font-weight="700" text-anchor="middle">ContextInject</text>
  <text x="483" y="156" fill="#64748b" font-size="9" text-anchor="middle">order=20</text>
  <text x="483" y="172" fill="#166534" font-size="8" text-anchor="middle">注入工作目录</text>

  <line x1="539" y1="149" x2="557" y2="149" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="559" y="116" width="112" height="66" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="615" y="136" fill="#334155" font-size="11" font-weight="700" text-anchor="middle">Logging</text>
  <text x="615" y="156" fill="#64748b" font-size="9" text-anchor="middle">order=100</text>
  <text x="615" y="172" fill="#94a3b8" font-size="8" text-anchor="middle">审计不改数据</text>

  <text x="475" y="216" fill="#64748b" font-size="9" text-anchor="middle">前一个的输出 = 后一个的输入（chain，非广播）</text>
  <text x="475" y="236" fill="#94a3b8" font-size="9" text-anchor="middle">任一个 block() → 链终止 → 本次 step 取消</text>

  <!-- 分支 -->
  <line x1="475" y1="252" x2="475" y2="296" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <polygon points="475,300 545,328 475,356 405,328" fill="#fff8f0" stroke="#d97706" stroke-width="2"/>
  <text x="475" y="326" fill="#92400e" font-size="10" font-weight="600" text-anchor="middle">blocked?</text>

  <line x1="405" y1="328" x2="300" y2="380" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-c)"/>
  <rect x="120" y="370" width="180" height="70" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="210" y="394" fill="#b91c1c" font-size="12" font-weight="700" text-anchor="middle">❌ 阻断</text>
  <text x="210" y="414" fill="#64748b" font-size="9" text-anchor="middle">"检测到: 删除数据库"</text>
  <text x="210" y="430" fill="#94a3b8" font-size="8" text-anchor="middle">本次 step 不调模型</text>

  <line x1="545" y1="328" x2="640" y2="380" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="560" y="370" width="150" height="70" rx="10" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
  <text x="635" y="394" fill="#166534" font-size="12" font-weight="700" text-anchor="middle">✅ 放行</text>
  <text x="635" y="414" fill="#64748b" font-size="9" text-anchor="middle">进入模型调用</text>

  <text x="360" y="472" fill="#94a3b8" font-size="11" text-anchor="middle">"一切皆插件"：安全/注入/审计都是插件——改 Agent 行为不动循环</text>
  <text x="360" y="494" fill="#cbd5e1" font-size="10" text-anchor="middle">配套代码：agent-source/deepseek_learn/d02_plugin_hooks/code.py ｜ 原版：dispatch.waterfall</text>
</svg>