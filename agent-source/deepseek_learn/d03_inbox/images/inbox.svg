<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" font-family="system-ui, 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
    <linearGradient id="hd" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e3a5f"/><stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>
  <rect width="720" height="500" fill="#fafbfc" rx="8"/>
  <rect x="0" y="0" width="720" height="48" fill="url(#hd)" rx="8"/>
  <rect x="0" y="40" width="720" height="8" fill="url(#hd)"/>
  <text x="360" y="31" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">Inbox — 消息投递与处理解耦</text>

  <!-- 生产者 -->
  <rect x="40" y="80" width="180" height="300" rx="10" fill="#f0f4ff" stroke="#2563eb" stroke-width="2"/>
  <text x="130" y="106" fill="#1e3a5f" font-size="13" font-weight="700" text-anchor="middle">生产者（随便谁）</text>
  <line x1="60" y1="116" x2="200" y2="116" stroke="#e2e8f0"/>
  <rect x="55" y="130" width="150" height="52" rx="8" fill="#fff"/>
  <text x="130" y="150" fill="#475569" font-size="10" text-anchor="middle">👤 用户打字</text>
  <text x="130" y="170" fill="#94a3b8" font-size="8" text-anchor="middle">→ post(next-step)</text>
  <rect x="55" y="196" width="150" height="52" rx="8" fill="#fff"/>
  <text x="130" y="216" fill="#475569" font-size="10" text-anchor="middle">🤖 子 Agent 汇报</text>
  <text x="130" y="236" fill="#94a3b8" font-size="8" text-anchor="middle">→ post(next-turn)</text>
  <rect x="55" y="262" width="150" height="52" rx="8" fill="#fff"/>
  <text x="130" y="282" fill="#475569" font-size="10" text-anchor="middle">⏰ 定时任务</text>
  <text x="130" y="302" fill="#94a3b8" font-size="8" text-anchor="middle">→ post(任意)</text>
  <text x="130" y="350" fill="#94a3b8" font-size="9" text-anchor="middle">只管投递，不管时序</text>

  <line x1="220" y1="230" x2="272" y2="230" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Inbox -->
  <rect x="274" y="90" width="260" height="280" rx="10" fill="#fff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="404" y="114" fill="#1e3a5f" font-size="13" font-weight="700" text-anchor="middle">Inbox（收件箱）</text>
  <line x1="294" y1="124" x2="514" y2="124" stroke="#e2e8f0"/>
  <rect x="294" y="140" width="220" height="74" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="404" y="162" fill="#92400e" font-size="11" font-weight="700" text-anchor="middle">next-turn 队列</text>
  <text x="404" y="184" fill="#64748b" font-size="9" text-anchor="middle">新任务（新一轮 turn）</text>
  <text x="404" y="202" fill="#94a3b8" font-size="8" text-anchor="middle">整批领取，一次处理</text>
  <rect x="294" y="230" width="220" height="74" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="404" y="252" fill="#92400e" font-size="11" font-weight="700" text-anchor="middle">next-step 队列</text>
  <text x="404" y="274" fill="#64748b" font-size="9" text-anchor="middle">当前回合插话（不打断）</text>
  <text x="404" y="292" fill="#94a3b8" font-size="8" text-anchor="middle">一次一条，逐条处理</text>
  <text x="404" y="340" fill="#94a3b8" font-size="9" text-anchor="middle">wake 标记：有消息才醒（whenIdle）</text>

  <line x1="534" y1="230" x2="586" y2="230" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Agent -->
  <rect x="588" y="160" width="110" height="140" rx="10" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
  <text x="643" y="188" fill="#166534" font-size="13" font-weight="700" text-anchor="middle" transform="rotate(90,643,188)">Agent</text>
  <text x="643" y="250" fill="#475569" font-size="9" text-anchor="middle">claim(目标)</text>
  <text x="643" y="268" fill="#64748b" font-size="8" text-anchor="middle">无消息就休眠</text>

  <!-- 场景 -->
  <rect x="150" y="392" width="420" height="72" rx="10" fill="#fff8f0" stroke="#d97706" stroke-width="1.5"/>
  <text x="360" y="414" fill="#92400e" font-size="11" font-weight="700" text-anchor="middle">场景：任务 1 进行中 → 用户插话（next-step）→ 同回合内处理</text>
  <text x="360" y="440" fill="#64748b" font-size="9" text-anchor="middle">先结算 turn 边界，再处理插话——不打断因果链</text>

  <text x="360" y="486" fill="#cbd5e1" font-size="10" text-anchor="middle">配套代码：agent-source/deepseek_learn/d03_inbox/code.py ｜ 原版：inbox.claim + whenIdle</text>
</svg>