<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" font-family="system-ui, 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
    <marker id="arrow-c" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-g" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
    <linearGradient id="hd" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e3a5f"/><stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>
  <rect width="720" height="480" fill="#fafbfc" rx="8"/>
  <rect x="0" y="0" width="720" height="48" fill="url(#hd)" rx="8"/>
  <rect x="0" y="40" width="720" height="8" fill="url(#hd)"/>
  <text x="360" y="31" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">Strict Schema — 参数的守门员</text>

  <!-- 模型 -->
  <rect x="40" y="90" width="200" height="120" rx="10" fill="#f0f4ff" stroke="#2563eb" stroke-width="2"/>
  <text x="140" y="114" fill="#1e3a5f" font-size="13" font-weight="700" text-anchor="middle">模型（会幻觉）</text>
  <line x1="60" y1="124" x2="220" y2="124" stroke="#e2e8f0"/>
  <rect x="55" y="138" width="170" height="28" rx="6" fill="#fff"/>
  <text x="140" y="157" fill="#b91c1c" font-size="9" text-anchor="middle">recipient: 12345（类型错）</text>
  <rect x="55" y="170" width="170" height="28" rx="6" fill="#fff"/>
  <text x="140" y="189" fill="#b91c1c" font-size="9" text-anchor="middle">缺必填参数 channel</text>

  <line x1="240" y1="150" x2="300" y2="150" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 守门员 -->
  <rect x="302" y="100" width="200" height="100" rx="10" fill="#fff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="402" y="124" fill="#1e3a5f" font-size="13" font-weight="700" text-anchor="middle">schema 守门员</text>
  <line x1="322" y1="134" x2="482" y2="134" stroke="#e2e8f0"/>
  <text x="402" y="156" fill="#475569" font-size="10" text-anchor="middle">签名→schema（s02）</text>
  <text x="402" y="174" fill="#475569" font-size="10" text-anchor="middle">逐字段运行时校验</text>
  <text x="402" y="192" fill="#64748b" font-size="9" text-anchor="middle">校验放在执行前·永不做白不做</text>

  <!-- 分支 -->
  <line x1="402" y1="200" x2="402" y2="240" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <polygon points="402,244 470,270 402,296 334,270" fill="#fff8f0" stroke="#d97706" stroke-width="2"/>
  <text x="402" y="268" fill="#92400e" font-size="10" font-weight="600" text-anchor="middle">合法?</text>

  <line x1="334" y1="270" x2="240" y2="320" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-c)"/>
  <rect x="60" y="310" width="190" height="80" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="155" y="334" fill="#b91c1c" font-size="12" font-weight="700" text-anchor="middle">❌ 拒绝（带原因）</text>
  <text x="155" y="356" fill="#64748b" font-size="9" text-anchor="middle">"参数 recipient 应为 integer"</text>
  <text x="155" y="374" fill="#94a3b8" font-size="8" text-anchor="middle">原因回传模型→自愈重试</text>

  <line x1="470" y1="270" x2="560" y2="320" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-g)"/>
  <rect x="500" y="310" width="190" height="80" rx="10" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
  <text x="595" y="334" fill="#166534" font-size="12" font-weight="700" text-anchor="middle">✅ 执行函数</text>
  <text x="595" y="356" fill="#64748b" font-size="9" text-anchor="middle">永远收到合法输入</text>
  <text x="595" y="374" fill="#94a3b8" font-size="8" text-anchor="middle">函数内部零防御代码</text>

  <!-- 底部 -->
  <rect x="150" y="412" width="420" height="52" rx="10" fill="#fff8f0" stroke="#d97706" stroke-width="1.5"/>
  <text x="360" y="434" fill="#92400e" font-size="11" font-weight="700" text-anchor="middle">守门员价值：模型幻觉在函数外被拦 → 错误≠崩溃，是信息</text>
  <text x="360" y="454" fill="#cbd5e1" font-size="8" text-anchor="middle">deepseek 的 ptc/py-types/ts-types：把这套推广到多语言多维类型推导</text>

  <text x="360" y="478" fill="#cbd5e1" font-size="10" text-anchor="middle">配套代码：agent-source/deepseek_learn/d04_strict_schema/code.py ｜ 原版：core/tools</text>
</svg>