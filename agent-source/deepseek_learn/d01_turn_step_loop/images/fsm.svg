<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" font-family="system-ui, 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
    <linearGradient id="hd" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e3a5f"/><stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>
  <rect width="720" height="500" fill="#fafbfc" rx="8"/>
  <rect x="0" y="0" width="720" height="48" fill="url(#hd)" rx="8"/>
  <rect x="0" y="40" width="720" height="8" fill="url(#hd)"/>
  <text x="360" y="31" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">Turn/Step 状态机 — 可观测的循环</text>

  <!-- 状态 -->
  <rect x="40" y="90" width="210" height="90" rx="10" fill="#f0f4ff" stroke="#2563eb" stroke-width="2"/>
  <text x="145" y="114" fill="#1e3a5f" font-size="13" font-weight="700" text-anchor="middle">Phase（状态）</text>
  <line x1="60" y1="124" x2="230" y2="124" stroke="#e2e8f0"/>
  <text x="145" y="146" fill="#475569" font-size="11" text-anchor="middle">IDLE → RUNNING → DONE</text>
  <text x="145" y="166" fill="#64748b" font-size="9" text-anchor="middle">决定"现在能不能动"</text>

  <line x1="250" y1="135" x2="300" y2="135" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 层级 -->
  <rect x="302" y="90" width="378" height="200" rx="10" fill="#fff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="491" y="114" fill="#1e3a5f" font-size="13" font-weight="700" text-anchor="middle">两级粒度</text>
  <line x1="322" y1="124" x2="660" y2="124" stroke="#e2e8f0"/>
  <rect x="322" y="136" width="160" height="62" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="402" y="160" fill="#92400e" font-size="12" font-weight="700" text-anchor="middle">turn（回合）</text>
  <text x="402" y="182" fill="#64748b" font-size="9" text-anchor="middle">一整轮任务：turn+1</text>
  <line x1="482" y1="167" x2="520" y2="167" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="522" y="136" width="136" height="62" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="590" y="158" fill="#92400e" font-size="11" font-weight="700" text-anchor="middle">step（步骤）</text>
  <text x="590" y="180" fill="#64748b" font-size="9" text-anchor="middle">一次模型调用</text>
  <text x="491" y="226" fill="#475569" font-size="10" text-anchor="middle">每 step 含：preStep → 模型 → 工具 → 日志</text>
  <text x="491" y="248" fill="#64748b" font-size="9" text-anchor="middle">可分别统计、可分别钩子、可分别重试</text>
  <text x="491" y="274" fill="#94a3b8" font-size="9" text-anchor="middle">对比"双层 while"：多管两层（粒度+日志）</text>

  <!-- 日志流 -->
  <line x1="491" y1="290" x2="491" y2="330" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="120" y="332" width="480" height="120" rx="10" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
  <text x="360" y="356" fill="#166534" font-size="13" font-weight="700" text-anchor="middle">会话日志（全程事件流）</text>
  <text x="360" y="382" fill="#475569" font-size="10" text-anchor="middle">kick → turn/start → [step/start → step/end]×N → turn/end</text>
  <text x="360" y="404" fill="#64748b" font-size="9" text-anchor="middle">turn/end 带 reason：completed / blocked / max-tokens / error</text>
  <text x="360" y="426" fill="#94a3b8" font-size="9" text-anchor="middle">调试/回放/评测全靠这条日志河（对应 deepseek session.append）</text>

  <text x="360" y="482" fill="#cbd5e1" font-size="10" text-anchor="middle">配套代码：agent-source/deepseek_learn/d01_turn_step_loop/code.py ｜ 原版：core/agent-loop/agent.ts</text>
</svg>