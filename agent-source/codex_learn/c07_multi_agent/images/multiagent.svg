<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" font-family="system-ui, 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
    <marker id="arrow-b" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <linearGradient id="hd" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e3a5f"/><stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>
  <rect width="720" height="500" fill="#fafbfc" rx="8"/>
  <rect x="0" y="0" width="720" height="48" fill="url(#hd)" rx="8"/>
  <rect x="0" y="40" width="720" height="8" fill="url(#hd)"/>
  <text x="360" y="31" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">Multi-Agent — 分工、并行、转场</text>

  <!-- 主 Agent -->
  <rect x="250" y="80" width="220" height="130" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="360" y="106" fill="#1e3a5f" font-size="14" font-weight="700" text-anchor="middle">Manager（主 Agent）</text>
  <line x1="275" y1="116" x2="445" y2="116" stroke="#e2e8f0"/>
  <text x="360" y="140" fill="#475569" font-size="11" text-anchor="middle">任务："给订单系统增加退款功能"</text>
  <text x="360" y="162" fill="#64748b" font-size="10" text-anchor="middle">可以派发子 Agent（spawn）</text>
  <text x="360" y="186" fill="#94a3b8" font-size="9" text-anchor="middle">转场控制：spawn → await → 决定</text>

  <!-- 派发箭头 -->
  <line x1="285" y1="210" x2="180" y2="260" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="435" y1="210" x2="540" y2="260" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 子 Agent -->
  <rect x="40" y="262" width="250" height="120" rx="10" fill="#f0f4ff" stroke="#2563eb" stroke-width="2"/>
  <text x="165" y="288" fill="#1e3a5f" font-size="12" font-weight="700" text-anchor="middle">Planner（子 Agent）</text>
  <line x1="60" y1="298" x2="270" y2="298" stroke="#e2e8f0"/>
  <text x="165" y="320" fill="#475569" font-size="10" text-anchor="middle">独立上下文副本</text>
  <text x="165" y="340" fill="#64748b" font-size="9" text-anchor="middle">产出：方案（读需求/设计接口/实现/测试）</text>
  <text x="165" y="360" fill="#94a3b8" font-size="9" text-anchor="middle">不污染主上下文</text>

  <rect x="430" y="262" width="250" height="120" rx="10" fill="#f0f4ff" stroke="#2563eb" stroke-width="2"/>
  <text x="555" y="288" fill="#1e3a5f" font-size="12" font-weight="700" text-anchor="middle">Reviewer（子 Agent）</text>
  <line x1="450" y1="298" x2="660" y2="298" stroke="#e2e8f0"/>
  <text x="555" y="320" fill="#475569" font-size="10" text-anchor="middle">评审 Planner 的方案</text>
  <text x="555" y="340" fill="#64748b" font-size="9" text-anchor="middle">产出：缺异常处理与回滚、补测试</text>
  <text x="555" y="360" fill="#94a3b8" font-size="9" text-anchor="middle">独立"域"（隔离运行）</text>

  <!-- 汇总 -->
  <line x1="165" y1="382" x2="250" y2="430" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-b)"/>
  <line x1="555" y1="382" x2="470" y2="430" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-b)"/>
  <rect x="252" y="416" width="216" height="56" rx="10" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
  <text x="360" y="438" fill="#166534" font-size="12" font-weight="700" text-anchor="middle">汇总子 Agent 产出 → 决策</text>
  <text x="360" y="458" fill="#64748b" font-size="9" text-anchor="middle">采纳方案 + 补充评审意见，排期 2 天</text>

  <text x="360" y="492" fill="#cbd5e1" font-size="10" text-anchor="middle">配套代码：agent-source/codex_learn/c07_multi_agent/code.py ｜ 原版：agent/control.rs + role.rs</text>
</svg>