<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" font-family="system-ui, 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
    <marker id="arrow-c" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-g" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
    <linearGradient id="hd" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e3a5f"/><stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>
  <rect width="720" height="500" fill="#fafbfc" rx="8"/>
  <rect x="0" y="0" width="720" height="48" fill="url(#hd)" rx="8"/>
  <rect x="0" y="40" width="720" height="8" fill="url(#hd)"/>
  <text x="360" y="31" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">Approvals — 危险操作谁说了算</text>

  <!-- 命令进入 -->
  <rect x="60" y="80" width="200" height="56" rx="10" fill="#f0f4ff" stroke="#2563eb" stroke-width="2"/>
  <text x="160" y="104" fill="#1e3a5f" font-size="13" font-weight="700" text-anchor="middle">命令进入</text>
  <text x="160" y="124" fill="#475569" font-size="10" text-anchor="middle">"git push origin main"</text>

  <line x1="260" y1="108" x2="310" y2="108" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 策略判定 -->
  <polygon points="360,78 468,108 360,138 252,108" fill="#fff8f0" stroke="#d97706" stroke-width="2"/>
  <text x="360" y="106" fill="#92400e" font-size="11" font-weight="600" text-anchor="middle">策略判定</text>
  <text x="360" y="122" fill="#92400e" font-size="9" text-anchor="middle">policy.judge()</text>

  <!-- 三条出路 -->
  <line x1="352" y1="138" x2="160" y2="180" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-c)"/>
  <rect x="60" y="182" width="200" height="70" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="160" y="206" fill="#b91c1c" font-size="12" font-weight="700" text-anchor="middle">deny → 拒绝</text>
  <text x="160" y="228" fill="#64748b" font-size="10" text-anchor="middle">rm -rf /、mkfs…</text>
  <text x="160" y="244" fill="#cbd5e1" font-size="9" text-anchor="middle">黑名单（铁律）</text>

  <line x1="472" y1="138" x2="600" y2="180" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-g)"/>
  <rect x="520" y="182" width="180" height="70" rx="10" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
  <text x="610" y="206" fill="#166534" font-size="12" font-weight="700" text-anchor="middle">auto → 放行</text>
  <text x="610" y="228" fill="#64748b" font-size="10" text-anchor="middle">ls、echo、cat…</text>
  <text x="610" y="244" fill="#cbd5e1" font-size="9" text-anchor="middle">白名单（零打断）</text>

  <!-- confirm 主路径 -->
  <line x1="360" y1="138" x2="360" y2="176" stroke="#d97706" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="240" y="178" width="240" height="60" rx="10" fill="#fff" stroke="#d97706" stroke-width="2"/>
  <text x="360" y="200" fill="#92400e" font-size="12" font-weight="700" text-anchor="middle">confirm → 查缓存</text>
  <text x="360" y="222" fill="#64748b" font-size="9" text-anchor="middle">5 秒内同一命令=免审（with_cached_approval）</text>

  <line x1="360" y1="238" x2="360" y2="278" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="240" y="280" width="240" height="64" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="360" y="304" fill="#334155" font-size="12" font-weight="600" text-anchor="middle">人工确认 / guardian AI</text>
  <text x="360" y="324" fill="#64748b" font-size="9" text-anchor="middle">批准 → 写缓存；拒绝 → 拦下</text>

  <!-- 审计 -->
  <rect x="60" y="380" width="600" height="72" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="360" y="404" fill="#92400e" font-size="12" font-weight="700" text-anchor="middle">审计日志（每个决策都可追溯）</text>
  <text x="360" y="428" fill="#475569" font-size="10" text-anchor="middle">deny: rm -rf | approve: git push | 来源标注：policy / cache / user</text>
  <text x="360" y="444" fill="#cbd5e1" font-size="9" text-anchor="middle">三层防线：策略判断成本最低；人工确认最可靠；缓存平衡流畅度</text>

  <text x="360" y="482" fill="#cbd5e1" font-size="10" text-anchor="middle">配套代码：agent-source/codex_learn/c03_approvals/code.py ｜ 原版：approvals.rs</text>
</svg>